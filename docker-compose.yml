services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AROMATWIN_POSTGRES_DB:-aromatwin}
      POSTGRES_USER: ${AROMATWIN_POSTGRES_USER:-aromatwin}
      POSTGRES_PASSWORD: ${AROMATWIN_POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes: [".:/app"]
    env_file: [.env]
    environment:
      AROMATWIN_DATABASE_URL: postgresql+psycopg://aromatwin:${AROMATWIN_POSTGRES_PASSWORD:-change-me}@postgres:5432/${AROMATWIN_POSTGRES_DB:-aromatwin}
    command: sh -c "pip install -e . && uvicorn aromatwin.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_data:
