name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run tests
        run: pytest
      - name: Validate public sample data
        run: python scripts/validate_data.py data
      - name: Audit supplier privacy
        run: python scripts/audit_supplier_data.py
      - name: Build deployable container
        run: docker build -t aromatwin-ci .
