[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scentgraph-intelligence-platform"
version = "0.1.0"
description = "Standalone API-first fragrance intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2", "fastapi>=0.115,<1", "pandas>=2.2,<3", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "psycopg[binary]>=3.2,<4", "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
